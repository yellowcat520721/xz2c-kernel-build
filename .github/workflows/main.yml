name: Build KernelSU-Next kernel (XZ2C apollo 4.9.337)

# 手动触发：Actions 页面 -> "Run workflow"
# 产物：可刷入的 AnyKernel3 zip（recovery 里刷） + Image.gz-dtb + 构建日志
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核仓库地址'
        required: true
        default: 'https://github.com/aoitsme/android_kernel_sony_sdm845.git'
      kernel_ref:
        description: '内核分支/标签/commit（你给的链接是 bpf）'
        required: true
        default: 'bpf'
      ksu_ref:
        description: 'KernelSU-Next ref（legacy = 非 GKI 手动 hook 分支）'
        required: true
        default: 'legacy'
      clang_version:
        description: 'AOSP clang 版本'
        required: true
        default: 'clang-r547379'
      defconfig:
        description: 'defconfig 名字'
        required: true
        default: 'tama_apollo_defconfig'
      binutils:
        description: 'binutils 来源：apt（推荐）或 los49（LineageOS 镜像的 gcc-4.9）'
        required: true
        default: 'apt'
      ld_kind:
        description: '链接器：gnu（默认）或 lld（GNU ld 报错时改这个再跑）'
        required: true
        default: 'gnu'
      make_jobs:
        description: '并行编译数（留空 = 自动）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    # 22.04 的 host gcc 11 / binutils 2.38 对 4.9 这种老内核更友好
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip rsync cpio \
            python3 python-is-python3 curl git lz4 zstd \
            binutils-aarch64-linux-gnu
          echo "--- binutils check ---"
          aarch64-linux-gnu-ld --version | head -n1 || echo "!! aarch64-linux-gnu-ld MISSING"

      - name: Show host info
        run: |
          nproc; free -h; df -h /
          gcc --version | head -n1

      # 只缓存 clang：上次失败的 run 在 toolchains/gcc 里留下了空目录，
      # 整个 toolchains 一起缓存会把这个坏状态带进来
      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/clang
          key: clang-${{ inputs.clang_version }}-v2

      - name: Build kernel with KernelSU-Next
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
          KSU_REF: ${{ inputs.ksu_ref }}
          CLANG_VERSION: ${{ inputs.clang_version }}
          DEFCONFIG: ${{ inputs.defconfig }}
          BINUTILS: ${{ inputs.binutils }}
          LD_KIND: ${{ inputs.ld_kind }}
          MAKE_JOBS: ${{ inputs.make_jobs }}
        run: |
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Show build failure summary
        if: always()
        run: |
          {
            echo "### kernel build summary"
            echo ""
            echo "- stage reached: \`$(cat out/.stage 2>/dev/null || echo none)\`"
            echo "- build.log: $(wc -l < build.log 2>/dev/null || echo 0) lines"
            echo "- toolchain dirs: $(ls toolchains 2>/dev/null | tr '\n' ' ')"
            echo ""
            echo '```'
            tail -n 45 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the built kernel really contains KernelSU
        run: bash scripts/verify.sh

      - name: Upload flashable AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-apollo-ak3
          path: |
            out/*.zip
            out/Image.gz-dtb
            out/build-info.txt
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            out/.stage
            out/*.txt
          if-no-files-found: warn
