name: Build KernelSU-Next kernel (XZ2C apollo 4.9.337)

# 手动触发：Actions 页面 -> "Run workflow"
# 产物：可刷入的 AnyKernel3 zip（recovery 里刷） + Image.gz-dtb + 日志
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核仓库地址'
        required: true
        default: 'https://github.com/aoitsme/android_kernel_sony_sdm845.git'
      kernel_ref:
        description: '内核分支/标签/commit（你给的链接是 bpf）'
        required: true
        default: 'bpf'
      ksu_ref:
        description: 'KernelSU-Next ref（legacy = 非 GKI 手动 hook 分支）'
        required: true
        default: 'legacy'
      clang_version:
        description: 'AOSP clang 版本'
        required: true
        default: 'clang-r547379'
      defconfig:
        description: 'defconfig 名字'
        required: true
        default: 'tama_apollo_defconfig'
      make_jobs:
        description: '并行编译数（留空 = 自动）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    # 22.04 的 host gcc 11 对 4.9 这种老内核更友好
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip rsync cpio \
            python3 python-is-python3 curl git lz4 zstd

      - name: Show host info
        run: |
          nproc; free -h; df -h /; gcc --version | head -n1; python3 --version

      - name: Build kernel with KernelSU-Next
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
          KSU_REF: ${{ inputs.ksu_ref }}
          CLANG_VERSION: ${{ inputs.clang_version }}
          DEFCONFIG: ${{ inputs.defconfig }}
          MAKE_JOBS: ${{ inputs.make_jobs }}
        run: |
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Verify the built kernel really contains KernelSU
        run: bash scripts/verify.sh

      - name: Upload flashable AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-apollo-ak3
          path: |
            out/*.zip
            out/Image.gz-dtb
            out/build-info.txt
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            out/*.txt
          if-no-files-found: warn
